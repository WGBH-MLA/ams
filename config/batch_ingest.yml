ingest_types:
  aapb_pbcore_zipped:
    label: "AAPB PBCore - Zipped"
    reader: "AAPB::BatchIngest::ZippedPBCoreReader"
    ingester: "AAPB::BatchIngest::PBCoreXMLItemIngester"
  aapb_csv_reader_1:
    label: "AAPB CSV Ingester"
    reader: "AAPB::BatchIngest::CSVReader"
    ingester: "AAPB::BatchIngest::CSVItemIngester"
    reader_options:
      schema:
      - object_class: AssetResource
        column_header: Asset
        ingest_type: new
        attributes:
        - asset_types
        - genre
        - date
        - broadcast_date
        - created_date
        - copyright_date
        - episode_number
        - spatial_coverage
        - temporal_coverage
        - audience_level
        - audience_rating
        - annotation
        - rights_summary
        - rights_link
        - local_identifier
        - pbs_nola_code
        - eidr_id
        - topics
        - subject
        - title
        - program_title
        - episode_title
        - segment_title
        - raw_footage_title
        - promo_title
        - clip_title
        - description
        - program_description
        - episode_description
        - segment_description
        - raw_footage_description
        - promo_description
        - clip_description
        - rundown_description
        - series_title
        - series_description
        - producing_organization
        - level_of_user_access
        - cataloging_status
        - outside_url
        - special_collections
        - transcript_status
        - sonyci_id
        - licensing_info
        - playlist_group
        - playlist_order
        - organization
        - proxy_start_time
        children:
        - object_class: ContributionResource
          column_header: "Contribution"
          ingest_type: new
          attributes:
          - contributor
          - contributor_role
          - contributor_role_annotation
          - portrayal
          - affiliation
          - affiliation_annotation
          - annotation
          - start_time
          - end_time
          - time_annotation
        - object_class: PhysicalInstantiationResource
          column_header: PhysicalInstantiation
          ingest_type: new
          attributes:
          - date
          - digitization_date
          - dimensions
          - format
          - standard
          - location
          - media_type
          - generations
          - time_start
          - duration
          - colors
          - rights_summary
          - rights_link:annotation
          - local_instantiation_identifier
          - tracks
          - channel_configuration
          - alternative_modes
          - holding_organization

