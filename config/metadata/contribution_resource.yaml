# Simple yaml config-driven schema which is used to define model attributes,
# index key names, and form properties.
#
# Attributes must have a type but all other configuration options are optional.
#
# attributes:
#   attribute_name:
#     type: string
#     multiple: false
#     index_keys:
#       - "attribute_name_sim"
#     form:
#       required: true
#       primary: true
#       multiple: false
#
# @see config/metadata/basic_metadata.yaml for an example configuration
#
# Generated via
#  `rails generate hyrax:work_resource ContributionResource`

attributes:
  bulkrax_identifier:
    type: string
    multiple: false
    index_keys:
      - "bulkrax_identifier_sim"
      - "bulkrax_identifier_tesim"
  contributor_role:
    type: string
    multiple: false
    index_keys:
      - "contributor_role_tesim"
    form:
      required: false
      primary: false
      multiple: false
  contributor_role_annotation:
    type: string
    multiple: false
    index_keys:
      - "contributor_role_annotation_tesim"
    form:
      required: false
      primary: false
      multiple: false
  portrayal:
    type: string
    multiple: false
    index_to_parent: true
    index_keys:
      - "portrayal_tesim"
    form:
      required: false
      primary: false
      multiple: false
  affiliation:
    type: string
    multiple: false
    index_to_parent: true
    index_keys:
      - "affiliation_tesim"
    form:
      required: false
      primary: false
      multiple: false
  affiliation_annotation:
    type: string
    multiple: false
    index_to_parent: true
    index_keys:
      - "affiliation_annotation_tesim"
    form:
      required: false
      primary: false
      multiple: false
  annotation:
    type: string
    multiple: false
    index_to_parent: false
    index_keys:
      - "annotation_tesim"
    form:
      required: false
      primary: false
      multiple: false
  start_time:
      type: float
      multiple: false
      index_to_parent: false
      index_keys:
        - "start_time_fsi"
      form:
        required: false
        primary: false
        multiple: false
  end_time:
      type: float
      multiple: false
      index_to_parent: false
      index_keys:
        - "end_time_fsi"
      form:
        required: false
        primary: false
        multiple: false
  time_annotation:
      type: string
      multiple: false
      index_to_parent: false
      index_keys:
        - "time_annotation_tesim"
      form:
        required: false
        primary: false
        multiple: false
